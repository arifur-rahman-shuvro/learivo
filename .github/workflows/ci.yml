name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm audit --audit-level=high
      - run: pnpm cycles
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Phone-width smoke test
        run: |
          npx playwright install --with-deps chromium
          pnpm smoke
          pnpm a11y
          pnpm e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - name: Build container image
        run: docker build -t learivo-api:ci .
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply stub and foundation migration (plain Postgres, stand-in for Supabase auth)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/local_stub.sql -f supabase/migrations/20261112000000_foundation.sql -f supabase/migrations/20261112010000_question_bank.sql -f supabase/migrations/20261113000000_practice_exams.sql -f supabase/migrations/20261113100000_workspace.sql -f supabase/migrations/20261114000000_home_layout.sql -f supabase/migrations/20261114100000_history_speed.sql -f supabase/migrations/20261115000000_five_options_marking.sql -f supabase/migrations/20261115100000_fk_indexes.sql -f supabase/migrations/20261115200000_exam_target.sql -f supabase/migrations/20261116000000_flashcards_glossary.sql -f supabase/migrations/20261116100000_profile_avatar.sql -f supabase/migrations/20261116200000_flexible_options.sql -f supabase/migrations/20261116300000_mistake_reason.sql -f supabase/migrations/20261117000000_item_seconds.sql -f supabase/migrations/20261119000000_delete_account.sql -f supabase/migrations/20261119100000_item_confidence.sql
      - name: Row-level-security checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_check.sql
      - name: Question bank checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_questions_check.sql
      - name: Practice and exam checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_practice_check.sql
      - name: Workspace checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_workspace_check.sql
      - name: History function checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_history_check.sql
      - name: Flashcard and glossary checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_cards_check.sql
      - name: Profile checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_profile_check.sql
      - name: Confidence checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/confidence_check.sql
      - name: Account deletion check
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/delete_account_check.sql
      - name: Schema security audit
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_audit_check.sql
      - name: Answer spec checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/answer_spec_check.sql
